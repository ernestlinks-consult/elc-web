<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Portal" style="font-family: 'DM Sans', Arial, sans-serif; background: #04048F; color: #D9DCFF; width: 100%; min-height: 100%; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px">
<a href="Portal-Dashboard.dc.html" aria-label="ELC Staff Portal home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 8px">
<img src="/_blob/c2f0fef82df935b313583730f905f1f7" alt="" style="width: 86px; height: auto">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #FFFFFF; border: 1px solid #6E6EF0; border-radius: 6px; padding: 3px 6px">PORTAL</span>
</a>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{true}}"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #B3B8F5; padding: 6px 10px">{{g.title}}</span></sc-if>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
<a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none; color: {{i.fg}}; background: {{i.bg}}; font-weight: {{i.weight}}; font-size: 15px; padding: 10px 12px; border-radius: 10px">{{i.label}}<sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{false}}"><span style="background: {{i.badgeBg}}; color: #FFFFFF; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px">{{i.badge}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; border-top: 1px solid #2A2AB8; padding: 14px 8px 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 17px; background: #FFFFFF; color: #0505C6; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px">GA</span><span style="display: flex; flex-direction: column; line-height: 1.3"><strong style="color: #FFFFFF">Godfred A.</strong><span style="color: #B3B8F5; font-size: 13px">Admin</span></span></div>
<a href="Main.dc.html" style="color: #FFFFFF; font-weight: 700">View website ↗</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","leads","scholarships","blog","videos","programmes","drives","trips","faqs","settings"],"default":"dashboard"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const it = (key, label, href, badge, urgent) => ({ label, href, current: a === key ? 'page' : 'false', fg: a === key ? '#0505C6' : '#FFFFFF', bg: a === key ? '#FFFFFF' : 'transparent', weight: a === key ? 800 : 500, hasBadge: !!badge, badge: badge || '', badgeBg: urgent ? '#EA0606' : '#2A2AD4' });
    const groups = [
      { title: '', hasTitle: false, items: [it('dashboard', 'Dashboard', 'Portal-Dashboard.dc.html'), it('leads', 'Leads', 'Portal-Leads.dc.html', '9 new', true)] },
      { title: 'WEBSITE CONTENT', hasTitle: true, items: [it('scholarships', 'Scholarship Hunt', 'Portal-Scholarships.dc.html', '2'), it('blog', 'Blog', 'Portal-Blog.dc.html', '1'), it('videos', 'Videos', 'Portal-Videos.dc.html'), it('programmes', 'Programmes & openings', 'Portal-Dashboard.dc.html', '3'), it('drives', 'Passport drives', 'Portal-Dashboard.dc.html'), it('trips', 'Group trips', 'Portal-Dashboard.dc.html'), it('faqs', 'FAQs', 'Portal-Dashboard.dc.html')] },
      { title: 'ADMIN', hasTitle: true, items: [it('settings', 'Settings & team', 'Portal-Settings.dc.html')] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
