<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0505C6}a:hover{color:#04048F}
:where(a,button,input,select,textarea):focus-visible{outline:3px solid #FFFFFF;outline-offset:0;box-shadow:0 0 0 6px #0505C6}
.fld{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid #8A8FC7;border-radius:10px;background:#FFFFFF;width:100%;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #8A8FC7;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;background:#FFFFFF}
.chip:has(input:checked){background:#0505C6;border-color:#0505C6;color:#FFFFFF}
.chip input{margin:0;accent-color:#FFFFFF}
</style>
</helmet>
<div style="font-family: 'DM Sans', Arial, sans-serif; color: #0B0B1F; background: #F5F6FF; width: 100%; display: flex; flex-wrap: wrap; min-height: 1000px">

<div style="flex: 1 1 248px; max-width: 248px; min-width: 0; display: flex"><dc-import name="PortalNav" active="videos" hint-size="248px,1000px"></dc-import></div>

<main style="flex: 999 1 640px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">

<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 30px; font-weight: 900">Videos</h1><span style="font-size: 14px; color: #4A4A68">Paste a link from TikTok, Instagram, Facebook or YouTube. The website plays it in the platform's own player. <span style="background: #FFF1D6; color: #8A4F00; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 999px">SAMPLE DATA</span></span></div>

<section aria-labelledby="add" style="background: #FFFFFF; border: 1px solid #DADDF5; border-radius: 18px; padding: 22px; display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 id="add" style="margin: 0; font-size: 20px; font-weight: 900">Add a video</h2>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Post link<input class="fld" type="url" value="{{url}}" onInput="{{onUrl}}" placeholder="https://www.tiktok.com/@_ernestlinksconsult/video/…"></label>
<span style="font-size: 14px; font-weight: 700; color: {{detColor}}">{{detected}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Title on the website<input class="fld" value="Nsoro explains the biggest study abroad myth"></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">WhatsApp keyword<input class="fld" value="MYTH"></label>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 700; padding: 0 0 8px">Show it on</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label class="chip"><input type="checkbox" checked="{{true}}">Videos page</label>
<label class="chip"><input type="checkbox">Homepage</label>
<label class="chip"><input type="checkbox" checked="{{true}}">School Applications</label>
<label class="chip"><input type="checkbox">Visa Applications</label>
<label class="chip"><input type="checkbox">Passports</label>
<label class="chip"><input type="checkbox">Work Abroad</label>
</div>
</fieldset>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0505C6">Pin to the top of the Videos page</label>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" style="font-family: inherit; font-size: 15px; font-weight: 800; background: #0505C6; color: #FFFFFF; border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer">Publish video</button><button type="button" style="font-family: inherit; font-size: 15px; font-weight: 800; background: #FFFFFF; color: #0505C6; border: 1px solid #8A8FC7; border-radius: 999px; padding: 11px 18px; cursor: pointer">Save draft</button></div>
</div>
<div style="flex: 1 1 220px; min-width: 0; max-width: 280px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 800; color: #4A4A68; letter-spacing: 0.06em">PREVIEW</span>
<div style="border: 1px solid #DADDF5; border-radius: 18px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px"><img src="/_blob/cb117de7a76a849f762a031d98eb8406" alt="" style="width: 26px; height: 26px; border-radius: 13px; border: 1px solid #DADDF5; padding: 3px; box-sizing: border-box"><strong>{{handle}}</strong></div>
<div style="aspect-ratio: 9 / 16; background: #0505C6; display: flex; align-items: center; justify-content: center; position: relative"><span style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 800; color: #FFFFFF; background: rgba(0,0,0,0.35); padding: 3px 8px; border-radius: 999px">{{platformTag}}</span><span style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path fill="#0505C6" d="M8 5v14l11-7z"></path></svg></span></div>
</div>
</div>
</section>

<section aria-labelledby="lib" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="lib" style="margin: 0; font-size: 20px; font-weight: 900">On the website (8)</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px">
<sc-for list="{{lib}}" as="v" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #DADDF5; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="aspect-ratio: 16 / 11; background: {{v.bg}}; position: relative"><span style="position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 800; color: #FFFFFF; background: rgba(0,0,0,0.35); padding: 3px 8px; border-radius: 999px">{{v.p}}</span><sc-if value="{{v.pinned}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 800; color: #0505C6; background: #FFFFFF; padding: 3px 8px; border-radius: 999px">PINNED</span></sc-if></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px; line-height: 1.35">{{v.t}}</strong><span style="font-size: 12px; color: #4A4A68">{{v.kw}} · added {{v.d}}</span><span style="display: flex; gap: 10px; font-size: 13px; font-weight: 700; padding-top: 4px"><a href="#">Edit</a><a href="#">Unpublish</a></span></div>
</div>
</sc-for>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { url: 'https://www.tiktok.com/@_ernestlinksconsult/video/7430000000000000000' }; }
  renderVals() {
    const u = (this.state.url || '').toLowerCase();
    const P = u.includes('tiktok.com') ? ['TikTok', '@_ernestlinksconsult'] : u.includes('instagram.com') ? ['Instagram', '@_ernestlinksconsult'] : (u.includes('youtube.com') || u.includes('youtu.be')) ? ['YouTube', '@ErnestLinksConsult'] : (u.includes('facebook.com') || u.includes('fb.watch')) ? ['Facebook', 'ErnestLinks Consult'] : null;
    const lib = [
      ['TikTok', 'Nsoro: the biggest study abroad myth', 'MYTH', '30 Oct', '#0505C6', true], ['Instagram', 'Malta nursing bridging in 60 seconds', 'MALTA NURSING', '29 Oct', '#04048F', false],
      ['TikTok', 'Getting your passport in Kumasi', 'PASSPORT', '28 Oct', '#2A2AD4', false], ['YouTube', 'Public health in the USA', 'HEALTH', '27 Oct', '#0505C6', false],
      ['Facebook', 'Early Childhood Education in Canada', 'ECE', '26 Oct', '#04048F', false], ['Instagram', 'A 12-month MBA in Malta', 'MALTA MBA', '25 Oct', '#2A2AD4', false],
      ['TikTok', 'Canada graduate certificates', 'CANADA CERT', '24 Oct', '#0505C6', false], ['YouTube', 'BSc Health & Social Care in Malta', 'MALTA CARE', '23 Oct', '#04048F', false]
    ].map(([p, t, kw, d, bg, pinned]) => ({ p: p.toUpperCase(), t, kw, d, bg, pinned }));
    return {
      url: this.state.url, onUrl: (e) => this.setState({ url: e.target.value }),
      detected: P ? '✓ ' + P[0] + ' video recognised. Thumbnail and player fetched.' : 'Paste a TikTok, Instagram, Facebook or YouTube link.',
      detColor: P ? '#0B6B30' : '#4A4A68', handle: P ? P[1] : 'ErnestLinks Consult', platformTag: P ? P[0].toUpperCase() : 'VIDEO', lib
    };
  }
}
</script>
</body>
</html>
