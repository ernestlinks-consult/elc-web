<svg xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, DejaVu Sans, Arial, sans-serif" viewBox="0 0 760 644" role="img" aria-label="Every content row has an owner, a publish state and an audit trail" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="erd2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8FC7"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#0B0B1F">Every content row has an owner, a publish state and an audit trail</text><g data-claude-anchor="staff"><rect x="280" y="44" width="200" height="40" rx="8" fill="#0505C6" fill-opacity="0.12" stroke="#0505C6" stroke-width="2"></rect><text data-claude-text-id="staff" x="380" y="69" text-anchor="middle" font-weight="600" fill="#0B0B1F">staff</text></g><g data-claude-anchor="connectors" fill="none" stroke="#8A8FC7" stroke-width="1.25"><path d="M380 84V112" marker-end="url(#erd2-arrow)"></path><path d="M560 452V476" marker-end="url(#erd2-arrow)"></path></g><text data-claude-text-id="owner-label" x="390" y="103" font-size="11.5" fill="#4A4A68">owner_id, author_id, verified_by</text><text data-claude-text-id="trigger-label" x="570" y="469" font-size="11.5" fill="#4A4A68">triggers write every change</text><g data-claude-anchor="content"><rect x="24" y="112" width="712" height="340" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="content" x="40" y="136" font-weight="600" fill="#0B0B1F">Content · each row: publish_state, owner_id → staff, timestamps</text><rect x="40" y="152" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="272" y="152" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="504" y="152" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="40" y="252" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="272" y="252" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="504" y="252" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="40" y="352" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="272" y="352" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><rect x="504" y="352" width="216" height="84" rx="8" fill="none" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="scholarships" x="52" y="174" font-weight="600" fill="#0B0B1F">scholarships</text><text data-claude-text-id="sch-1" x="52" y="192" font-size="11.5" fill="#4A4A68">official_url, verified_on</text><text data-claude-text-id="sch-2" x="52" y="208" font-size="11.5" fill="#4A4A68">opens_on, deadline_on</text><text data-claude-text-id="sch-3" x="52" y="224" font-size="11.5" fill="#4A4A68">status: computed in a view</text><text data-claude-text-id="posts" x="284" y="174" font-weight="600" fill="#0B0B1F">posts</text><text data-claude-text-id="post-1" x="284" y="192" font-size="11.5" fill="#4A4A68">title, slug, summary</text><text data-claude-text-id="post-2" x="284" y="208" font-size="11.5" fill="#4A4A68">body (Tiptap JSON)</text><text data-claude-text-id="post-3" x="284" y="224" font-size="11.5" fill="#4A4A68">category, author_id → staff</text><text data-claude-text-id="videos" x="516" y="174" font-weight="600" fill="#0B0B1F">videos + video_placements</text><text data-claude-text-id="vid-1" x="516" y="192" font-size="11.5" fill="#4A4A68">platform, url, embed_html</text><text data-claude-text-id="vid-2" x="516" y="208" font-size="11.5" fill="#4A4A68">title, keyword, pinned</text><text data-claude-text-id="vid-3" x="516" y="224" font-size="11.5" fill="#4A4A68">placements: page keys</text><text data-claude-text-id="programmes" x="52" y="274" font-weight="600" fill="#0B0B1F">programmes</text><text data-claude-text-id="prog-1" x="52" y="292" font-size="11.5" fill="#4A4A68">kind: study or bridging</text><text data-claude-text-id="prog-2" x="52" y="308" font-size="11.5" fill="#4A4A68">country, level, tuition_text</text><text data-claude-text-id="prog-3" x="52" y="324" font-size="11.5" fill="#4A4A68">correct_as_of, keyword</text><text data-claude-text-id="openings" x="284" y="274" font-weight="600" fill="#0B0B1F">openings</text><text data-claude-text-id="open-1" x="284" y="292" font-size="11.5" fill="#4A4A68">country, sector, title</text><text data-claude-text-id="open-2" x="284" y="308" font-size="11.5" fill="#4A4A68">requirements, candidate_costs</text><text data-claude-text-id="open-3" x="284" y="324" font-size="11.5" fill="#4A4A68">correct_as_of, keyword</text><text data-claude-text-id="faqs" x="516" y="274" font-weight="600" fill="#0B0B1F">faqs</text><text data-claude-text-id="faq-1" x="516" y="292" font-size="11.5" fill="#4A4A68">service_key → services</text><text data-claude-text-id="faq-2" x="516" y="308" font-size="11.5" fill="#4A4A68">question, answer</text><text data-claude-text-id="faq-3" x="516" y="324" font-size="11.5" fill="#4A4A68">sort_order</text><text data-claude-text-id="drives" x="52" y="374" font-weight="600" fill="#0B0B1F">drives</text><text data-claude-text-id="drv-1" x="52" y="392" font-size="11.5" fill="#4A4A68">host_name, drive_date</text><text data-claude-text-id="drv-2" x="52" y="408" font-size="11.5" fill="#4A4A68">applicants_count, photo_path</text><text data-claude-text-id="trips" x="284" y="374" font-weight="600" fill="#0B0B1F">trips</text><text data-claude-text-id="trip-1" x="284" y="392" font-size="11.5" fill="#4A4A68">destination, starts_on, ends_on</text><text data-claude-text-id="trip-2" x="284" y="408" font-size="11.5" fill="#4A4A68">price_from_ghs, seats_left</text><text data-claude-text-id="testimonials" x="516" y="374" font-weight="600" fill="#0B0B1F">testimonials</text><text data-claude-text-id="tst-1" x="516" y="392" font-size="11.5" fill="#4A4A68">quote, display_name, year</text><text data-claude-text-id="tst-2" x="516" y="408" font-size="11.5" fill="#4A4A68">permission_on_file (required)</text></g><g data-claude-anchor="settings"><rect x="24" y="476" width="348" height="144" rx="8" fill="#F5F6FF" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="settings" x="40" y="500" font-weight="600" fill="#0B0B1F">Settings (admins edit)</text><text data-claude-text-id="set-1" x="40" y="524" font-size="11.5" fill="#0B0B1F">prices: key, label, amount_ghs, time_text,</text><text data-claude-text-id="set-2" x="40" y="540" font-size="11.5" fill="#0B0B1F">is_public, never_public, shown_on[]</text><text data-claude-text-id="set-3" x="40" y="556" font-size="11.5" fill="#0B0B1F">settings: key → value (contacts, hours, MoMo)</text><text data-claude-text-id="set-4" x="40" y="572" font-size="11.5" fill="#0B0B1F">live_schedule: weekday, topic, host_id → staff</text><text data-claude-text-id="set-5" x="40" y="588" font-size="11.5" fill="#0B0B1F">services: key, ref_prefix, owner_id → staff</text></g><g data-claude-anchor="operations"><rect x="388" y="476" width="348" height="144" rx="8" fill="#F5F6FF" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="operations" x="404" y="500" font-weight="600" fill="#0B0B1F">Operations (system-written)</text><text data-claude-text-id="ops-1" x="404" y="524" font-size="11.5" fill="#0B0B1F">audit_log: actor, action, table, before, after</text><text data-claude-text-id="ops-2" x="404" y="540" font-size="11.5" fill="#0B0B1F">content_comments: item, author, body, resolved</text><text data-claude-text-id="ops-3" x="404" y="556" font-size="11.5" fill="#0B0B1F">events: name, page, session, lead_id, props</text><text data-claude-text-id="ops-4" x="404" y="572" font-size="11.5" fill="#0B0B1F">staff_content_access: staff_id, content_type</text></g></svg>