<svg xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, DejaVu Sans, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="A lead exists the moment step 1 is saved; messages go out after" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="lead-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8FC7"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#0B0B1F">A lead exists the moment step 1 is saved; messages go out after</text><g data-claude-anchor="connectors" fill="none" stroke="#8A8FC7" stroke-width="1.25"><path d="M184 92H208" marker-end="url(#lead-arrow)"></path><path d="M368 92H392" marker-end="url(#lead-arrow)"></path><path d="M552 92H576" marker-end="url(#lead-arrow)"></path><path d="M656 128V176" marker-end="url(#lead-arrow)"></path><path d="M576 212H552" marker-end="url(#lead-arrow)"></path><path d="M656 248V272H288V248" marker-end="url(#lead-arrow)"></path><path d="M472 128V152H104V176" marker-end="url(#lead-arrow)"></path></g><g data-claude-anchor="a1"><rect x="24" y="56" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="a1" x="36" y="80" font-weight="600" fill="#0B0B1F">Visitor taps Save</text><text data-claude-text-id="a1-l1" x="36" y="96" font-size="11.5" fill="#4A4A68">Step 1: name, phone,</text><text data-claude-text-id="a1-l2" x="36" y="112" font-size="11.5" fill="#4A4A68">choices, consent</text></g><g data-claude-anchor="a2"><rect x="208" y="56" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="a2" x="220" y="80" font-weight="600" fill="#0B0B1F">Server action</text><text data-claude-text-id="a2-l1" x="220" y="96" font-size="11.5" fill="#4A4A68">Validates input,</text><text data-claude-text-id="a2-l2" x="220" y="112" font-size="11.5" fill="#4A4A68">honeypot, rate limit</text></g><g data-claude-anchor="a3"><rect x="392" y="56" width="160" height="72" rx="8" fill="#0505C6" fill-opacity="0.12" stroke="#0505C6" stroke-width="2"></rect><text data-claude-text-id="a3" x="404" y="80" font-weight="600" fill="#0B0B1F">Lead saved</text><text data-claude-text-id="a3-l1" x="404" y="96" font-size="11.5" fill="#0B0B1F">Status New, with a</text><text data-claude-text-id="a3-l2" x="404" y="112" font-size="11.5" fill="#0B0B1F">reference: ELC-PP-1042</text></g><g data-claude-anchor="a4"><rect x="576" y="56" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="a4" x="588" y="80" font-weight="600" fill="#0B0B1F">Owner assigned</text><text data-claude-text-id="a4-l1" x="588" y="96" font-size="11.5" fill="#4A4A68">From service owners</text><text data-claude-text-id="a4-l2" x="588" y="112" font-size="11.5" fill="#4A4A68">in Settings</text></g><g data-claude-anchor="b1"><rect x="576" y="176" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="b1" x="588" y="200" font-weight="600" fill="#0B0B1F">Notification queued</text><text data-claude-text-id="b1-l1" x="588" y="216" font-size="11.5" fill="#4A4A68">Outbox row, retried</text><text data-claude-text-id="b1-l2" x="588" y="232" font-size="11.5" fill="#4A4A68">until sent</text></g><g data-claude-anchor="b2"><rect x="392" y="176" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"></rect><text data-claude-text-id="b2" x="404" y="200" font-weight="600" fill="#0B0B1F">SMS to the lead</text><text data-claude-text-id="b2-l1" x="404" y="216" font-size="11.5" fill="#4A4A68">Owner name and ref</text></g><g data-claude-anchor="b3"><rect x="208" y="176" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8A8FC7" stroke-width="1.25"